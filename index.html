<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Currency Converter · Live Rates</title>
    <!-- Font Awesome (free icons) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <!-- External CSS -->
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div class="converter-wrapper">
        <!-- Background Decorative Elements -->
        <div class="bg-circle bg-circle-1"></div>
        <div class="bg-circle bg-circle-2"></div>
        <div class="bg-circle bg-circle-3"></div>
        
        <div class="converter-card">
            <!-- Header -->
            <div class="header">
                <div class="header-icon">
                    <i class="fas fa-coins"></i>
                </div>
                <div>
                    <h1>Currency <span>Converter</span></h1>
                    <p class="subtitle">
                        <i class="fas fa-arrow-right"></i> Live exchange rates
                    </p>
                </div>
            </div>

            <!-- Amount Input -->
            <div class="input-section">
                <label class="input-label">
                    <i class="fas fa-dollar-sign"></i> Amount
                </label>
                <div class="input-group">
                    <input 
                        type="number" 
                        id="amount" 
                        placeholder="Enter amount" 
                        value="1" 
                        min="0" 
                        step="any" 
                        autofocus
                    />
                    <div class="currency-badge" id="fromCurrencyDisplay">
                        <img id="fromFlag" src="" alt="flag" class="flag-icon" />
                        <span class="currency-code">USD</span>
                    </div>
                </div>
            </div>

            <!-- Currency Selection -->
            <div class="currency-section">
                <div class="currency-select-wrapper">
                    <div class="currency-select">
                        <label for="fromCurrency">
                            <i class="fas fa-arrow-up"></i> From
                        </label>
                        <select id="fromCurrency" class="currency-dropdown">
                            <!-- Options will be populated by JavaScript -->
                        </select>
                    </div>

                    <button id="swapButton" class="swap-btn" title="Swap currencies">
                        <i class="fas fa-arrow-right-arrow-left"></i>
                    </button>

                    <div class="currency-select">
                        <label for="toCurrency">
                            <i class="fas fa-arrow-down"></i> To
                        </label>
                        <select id="toCurrency" class="currency-dropdown">
                            <!-- Options will be populated by JavaScript -->
                        </select>
                    </div>
                </div>
            </div>

            <!-- Convert Button -->
           <button id="convertBtn" class="convert-btn">
                <i class="fas fa-calculator"></i> 
                <span>Convert Now</span>
                <i class="fas fa-arrow-right"></i>
            </button>

            <!-- Result Display -->
            <div class="result-section">
                <div class="result-box" id="resultBox">
                    <div class="result-label">Converted Amount</div>
                    <div class="result-value">
                        <span id="resultText">—</span>
                    </div>
                </div>
            </div>

            <!-- Rate Information -->
            <div class="rate-info">
                <div class="rate-badge">
                    <i class="fas fa-sync-alt fa-fw"></i>
                    <span id="rateInfo">1 USD = 83.50 INR</span>
                </div>
                <div class="rate-status" id="rateStatus">
                    <span class="status-dot"></span>
                    <span>Live</span>
                </div>
            </div>

            <!-- Footer -->
            <div class="footer">
                <span>Powered by</span>
                <span class="footer-brand">
                    <i class="fas fa-cloud-sun"></i> RazakAPI
                </span>
                <span class="footer-divider">·</span>
                <span id="updateTime">
                    <i class="far fa-clock"></i> Updated today
                </span>
            </div>
        </div>
    </div>

    <!-- External JavaScript -->
    <script src="script.js"></script>
</body>
</html>
